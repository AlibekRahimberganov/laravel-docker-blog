name: CI-CD
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- 1-bosqich: Test ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
      - name: PHP o'rnatish
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, zip, gd
      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: .env yaratish
        run: cp .env.example .env
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: NPM install va build
        run: |
          npm ci
          npm run build
      - name: APP_KEY generatsiya
        run: php artisan key:generate
      - name: SQLite fayl yaratish
        run: |
          mkdir -p database
          touch database/database.sqlite
      - name: Testlarni ishga tushirish
        run: php artisan test
      - name: Dockerfile build tekshiruvi
        run: docker build -t bsk-test-build .

  # ---------- Secretlar mavjudligini tekshirish ----------
  check-secrets:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Kerakli secretlar borligini tekshirish
        id: check
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && \
             [ -n "${{ secrets.SERVER_USER }}" ] && \
             [ -n "${{ secrets.SERVER_SSH_KEY }}" ] && \
             [ -n "${{ secrets.SERVER_PROJECT_PATH }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy uchun kerakli secretlar topilmadi, deploy bosqichi skip qilinadi."
          fi

  # ---------- 2-bosqich: Deploy ----------
  deploy:
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has_secrets == 'true'
    steps:
      - name: Serverga SSH orqali ulanib deploy.sh ni ishga tushirish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
